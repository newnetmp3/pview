name: Validate PView Firefox add-ons

on:
  push:
    branches:
      - main
    paths:
      - "addons/pornhex-video-saver/**"
      - ".github/workflows/sign-firefox.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PView
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run add-on tests
        working-directory: addons/pornhex-video-saver
        run: |
          node tests/run.js
          node tests/hls-integration.js

      - name: Validate Firefox manifest and package
        run: |
          npm exec --yes --package=web-ext -- web-ext lint \
            --source-dir addons/pornhex-video-saver \
            --ignore-files "tests/**" README.md sign-unlisted.sh

# The Mozilla credentials are held in the R20eb repository's firefox-signing
# environment, not in PView. The signing workflow is:
# https://github.com/newnetmp3/roll20embetterment/actions/workflows/pview-firefox-sign.yml
